# agent-docs-skills markdownlint 配置
#
# 以下禁用规则均因技能文档特例：
# - 代码块内容可能被误判为标题 (MD025)
# - 技能文档中 fenced/indented 代码块混用 (MD046)
# - YAML frontmatter 中的 description 行可能过长 (MD013)
# - CJK+代码混排表格导致列对齐误报 (MD060)
# - 技能文档存在大量无 language spec 的代码块 (MD040)
# - 多个"示例""何时使用"等标题重复 (MD024)

default = true

MD024 = false   # 不同章节允许相同标题——代码块内的重复 H2 会被误判
MD025 = false   # 保留——部分 markdownlint 版本仍可能误判代码块内的 #；当前版本已正确处理但留作保险
MD036 = false   # 故意使用加粗文字作为子标题（如 TDD 中的"RED"/scope-and-loader 的"文件清单"）
MD040 = false   # 技能文档约 20% 代码块无需 language spec（ASCII 图/目录树/markdown 示例含嵌套栅栏）
MD060 = false   # CJK+代码混排表格中列对齐误报严重
# MD046（代码块风格一致）无需禁用——当前已全库使用 fenced 风格，0 违规

[MD013]
line_length = 200   # 行宽 200（CJK 混排 + URL 引用需要更多空间）
code_blocks = false # 代码块内的长行不报错
tables = false      # 表格内容不折行
heading_line_length = 80  # 标题保持简短

[MD033]
allowed_elements = ["br", "code", "pre", "details", "summary"]  # 技能文档允许的 HTML 元素（中文标签如 <好>/<坏> 因 markdownlint 不识别中文为元素名而无需列入）
