# agent-prompt-skills markdownlint 配置
#
# 以下禁用规则均因技能文档特例：
# - 代码块内容可能被误判为标题 (MD025)
# - 技能文档中 fenced/indented 代码块混用 (MD046)
# - YAML frontmatter 中的 description 行可能过长 (MD013)
# - CJK+代码混排表格导致列对齐误报 (MD060)
# - 技能文档存在大量无 language spec 的代码块 (MD040)
# - 多个"示例""何时使用"等标题重复 (MD024)

default = true

MD024 = false   # 不同章节允许相同标题（如多个"示例"）
MD025 = false   # 代码块内容被误判为标题
MD036 = false   # 故意使用加粗文字作为子标题（如 TDD 中的"RED"/借口标题）
MD040 = false   # 技能文档大量代码块无需 language spec（Shell/Python/JS 混合）
MD046 = false   # 代码块风格 fenced/indented 混用
MD060 = false   # CJK+代码混排表格中列对齐误报严重

[MD013]
line_length = 200   # 行宽 200（CJK 混排 + URL 引用需要更多空间）
code_blocks = false # 代码块内的长行不报错
tables = false      # 表格内容不折行
heading_line_length = 80  # 标题保持简短

[MD033]
allowed_elements = ["br", "code", "pre", "details", "summary", "Good", "Bad"]  # 技能文档允许的 HTML 元素（含 TDD 正反示例标签）
